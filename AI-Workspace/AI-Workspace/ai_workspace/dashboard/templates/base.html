<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Workspace Dashboard{% endblock %}</title>

    <!-- Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

    <!-- Component Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>

    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    {% block extra_css %}{% endblock %}
</head>
<body class="bg-gray-100">
    <!-- Skip to main content (accessibility) -->
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-blue-600 focus:text-white focus:rounded">
        Skip to main content
    </a>

    <!-- Navigation Bar Component -->
    {% include 'components/navbar.html' %}

    <!-- Main Content -->
    <main id="main-content" class="container mx-auto px-4 py-8" role="main">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white mt-12 py-6" role="contentinfo">
        <div class="container mx-auto px-4 text-center">
            <p class="text-sm">AI Workspace Dashboard - Optional visualization module</p>
            <p class="text-xs text-gray-400 mt-2">
                Install: pip install ai-workspace[dashboard] | Port: 8900
            </p>
        </div>
    </footer>

    <!-- Screen reader announcements -->
    <div class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

    {% block extra_js %}{% endblock %}
</body>
</html>
