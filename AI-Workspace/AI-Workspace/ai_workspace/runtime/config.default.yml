# Default Runtime Configuration for AI Workspace
# This file contains all configurable parameters with recommended defaults.
# Copy and modify to customize runtime behavior.

# ==================== Process Pool Configuration ====================
# Controls worker process management and lifecycle

# Number of pre-spawned worker processes
# Recommended: Set to CPU core count for CPU-bound tasks,
#              or 2-4x cores for I/O-bound tasks
# Performance: Higher = lower latency, higher memory usage
pool_size: 4

# Pre-spawn workers during startup (vs lazy spawning on-demand)
# Enable for consistent low latency, disable to reduce initial memory footprint
pool_warmup_enabled: true

# Recycle worker after this many tasks (prevents memory leaks)
# Set to 0 to disable task-based recycling
# Recommended: 50-200 for long-running services
worker_recycle_after_tasks: 100

# Maximum worker lifetime in seconds (prevents stale workers)
# Set to 0 to disable age-based recycling
# Default: 1 hour (3600s)
worker_max_age_seconds: 3600

# Idle timeout before terminating excess workers (seconds)
# Workers idle longer than this may be terminated if pool > minimum
worker_timeout_seconds: 60

# ==================== Resource Limits Configuration ====================
# Default constraints applied when not explicitly specified

# Default memory limit per agent (MB)
# Recommended: 1024-4096 MB for typical agents
# Increase for memory-intensive tasks (e.g., ML, large data processing)
default_memory_mb: 2048

# Default CPU limit as percentage of one core
# 100 = 1 full core, 200 = 2 cores, 400 = 4 cores, etc.
# Recommended: 80-100 for single-threaded agents
default_cpu_percent: 80

# Default execution timeout (seconds)
# Agents exceeding this duration are terminated
# Recommended: 300-900 for typical tasks, higher for ML training
default_timeout_seconds: 600

# Enable real-time resource usage monitoring
# Tracks memory/CPU during execution for metrics
# Disable for maximum performance (skip monitoring overhead ~1-2%)
enable_resource_monitoring: true

# Interval between resource checks (seconds)
# Lower = more accurate, higher overhead
# Higher = less overhead, less accurate
# Recommended: 0.5-2.0 seconds
monitoring_interval_seconds: 1.0

# ==================== IPC Configuration ====================
# Inter-process communication settings

# Timeout for sending messages to workers (seconds)
# Increase if experiencing frequent timeouts under high load
ipc_timeout_seconds: 5.0

# Timeout for collecting results from workers (seconds)
# Should be >= ipc_timeout_seconds
# Accounts for result serialization time
ipc_collection_timeout_seconds: 10.0

# Maximum IPC message size (KB)
# Prevents excessive memory usage from large payloads
# Increase if handling large artifacts or outputs
# Default: 1 MB (1024 KB)
max_message_size_kb: 1024

# ==================== Performance Configuration ====================
# Monitoring and metrics collection settings

# Enable performance metrics collection
# Tracks task duration, throughput, resource usage
# Disable in production if maximum performance needed
enable_metrics_collection: true

# Number of task metrics to retain in memory
# Used for computing averages, percentiles, trends
# Higher = more accurate stats, higher memory usage (~1KB per task)
# Recommended: 500-2000 for typical workloads
metrics_retention_count: 1000

# Enable health monitoring for workers
# Periodically checks worker responsiveness and recycles unhealthy workers
# Recommended to keep enabled in production
enable_health_monitoring: true

# ==================== Tuning Guide ====================
#
# Low Latency (Fast Response):
#   pool_size: 8-16
#   pool_warmup_enabled: true
#   monitoring_interval_seconds: 2.0
#
# High Throughput (Many Tasks):
#   pool_size: 16-32
#   worker_recycle_after_tasks: 200
#   enable_resource_monitoring: false
#
# Memory Constrained:
#   pool_size: 2-4
#   default_memory_mb: 1024
#   worker_recycle_after_tasks: 50
#
# CPU Intensive Tasks:
#   pool_size: <num_cores>
#   default_cpu_percent: 100
#   worker_recycle_after_tasks: 20
#
# Development/Testing:
#   pool_size: 2
#   enable_metrics_collection: true
#   enable_health_monitoring: true
#   monitoring_interval_seconds: 0.5
