name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: '3.11'
  CACHE_KEY_PREFIX: beverly-knits-erp

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libatlas-base-dev libffi-dev libssl-dev

      - name: Restore pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ env.CACHE_KEY_PREFIX }}-pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt', 'setup.py') }}
          restore-keys: |
            ${{ env.CACHE_KEY_PREFIX }}-pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]

      - name: Lint (flake8)
        run: |
          flake8 src tests

      - name: Run unit tests with coverage
        run: |
          pytest --maxfail=1 --disable-warnings --cov=src --cov-report=xml

      - name: Enforce coverage threshold
        run: |
          coverage report --fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker-build:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: beverly-knits-erp:ci
          push: false

      - name: Save image artifact
        run: |
          docker save beverly-knits-erp:ci -o beverly-knits-erp-ci.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: beverly-knits-erp-ci-image
          path: beverly-knits-erp-ci.tar

  deploy-staging:
    name: Deploy (Manual Approval)
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://example.com/dashboard
    steps:
      - name: Await operator deployment trigger
        run: |
          echo "Deployment requires manual approval via the production environment gate."
          echo "See .agent-workspace/outputs/documentation/2025-10-13-devops-engineer-ci-playbook.md for rollout steps."
